server:
  port: 8080
  servlet:
    jsp:
      init-parameters:
        development: true

spring:
  application:
    name: flashticket

  # ---- Database ----
  datasource:
    url: jdbc:postgresql://localhost:5432/flashticket
    username: postgres
    password: Saibaba25$
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized modestly on purpose: Redis absorbs the write-contention spike,
      # so the DB pool only needs to handle the *conversion* rate, not the *request* rate.
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
    open-in-view: false

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  # ---- Kafka ----
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Outbox rows already store the event as a JSON string, so the producer
      # ships raw strings and consumers parse them with ObjectMapper — this
      # avoids double-encoding that Kafka's JsonSerializer would otherwise cause.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
    consumer:
      group-id: flashticket-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

# ---- App-specific ----
flashticket:
  jwt:
    secret: "CHANGE_ME_dev_only_secret_key_flashticket_32_bytes_min"
    expiration-ms: 3600000
  kafka:
    topics:
      order-created: orders.v1
      payment-confirmed: payments.v1
      notification: notifications.v1
  redis:
    reservation-ttl-seconds: 600
  ratelimit:
    max-purchase-attempts-per-minute: 5

resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.flashticket: INFO
